name: Nightly screener scan

on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily (~1:20am CT)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run screener
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          # keep yesterday's scan for rank-delta arrows on the site
          cp web/data.json web/data_prev.json 2>/dev/null || true
          python crypto-dashboard/screener.py --top 10
          cp crypto-dashboard/screener_cache.json web/data.json

      - name: Commit refreshed data
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data.json web/data_prev.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Nightly screener scan"
          git push
