name: Nightly screener scan

on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily (~1:20am CT)
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      test_ntfy:
        description: "Send a test ntfy push instead of change-detection"
        required: false
        default: "0"

permissions:
  contents: write

# Queue runs instead of overlapping — two simultaneous runs race on the
# final data-commit push and the loser fails with a non-fast-forward error
concurrency:
  group: screener-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run screener
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          # keep yesterday's scan for rank-delta arrows on the site
          cp web/data.json web/data_prev.json 2>/dev/null || true
          python crypto-dashboard/screener.py --top 10
          cp crypto-dashboard/screener_cache.json web/data.json

      - name: Run BTC cycle monitor
        run: |
          cp web/cycle.json web/cycle_prev.json 2>/dev/null || true
          python crypto-dashboard/cycle_monitor.py || echo "cycle monitor failed - keeping previous cycle.json"
          [ -f crypto-dashboard/cycle_cache.json ] && cp crypto-dashboard/cycle_cache.json web/cycle.json || true

      - name: Fetch stock quotes for watchlist
        run: |
          python crypto-dashboard/watchlist_stocks.py || echo "stocks fetch failed (non-fatal)"
          [ -f crypto-dashboard/stocks_cache.json ] && cp crypto-dashboard/stocks_cache.json web/stocks.json || true

      - name: Run bluechip rare-break scan
        run: |
          # ~500 tickers x 10y of daily bars via yfinance; slow and flaky, so
          # everything here is non-fatal and a bad payload never overwrites a
          # good web/bluechip/scan.json (see publish guard below).
          pip install -q yfinance pandas numpy || echo "bluechip deps install failed (non-fatal)"
          python crypto-dashboard/rare_break_scanner.py --selftest || echo "bluechip selftest failed (non-fatal)"
          timeout 25m python crypto-dashboard/rare_break_scanner.py \
            --json-out crypto-dashboard/bluechip_scan.json \
            --out /tmp/rare_break_scan.csv \
            --include-all || echo "bluechip scan failed (non-fatal)"
          [ -f crypto-dashboard/bluechip_scan.json ] && python - <<'PY' && cp crypto-dashboard/bluechip_scan.json web/bluechip/scan.json || echo "bluechip scan not published (non-fatal)"
          import json, sys
          d = json.load(open('crypto-dashboard/bluechip_scan.json'))
          n = len(d.get('rows', []))
          print(f"{n} names in bluechip payload")
          if n < 100:
              sys.exit(f"only {n} names - data pull probably failed, keeping previous scan.json")
          if d.get('demo'):
              sys.exit("payload still flagged demo, keeping previous scan.json")
          PY

      - name: Send ntfy notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ github.event.inputs.test_ntfy || '0' }}
        run: python crypto-dashboard/notify.py || echo "notify failed (non-fatal)"

      - name: Commit refreshed data
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data.json
          [ -f web/data_prev.json ] && git add web/data_prev.json
          [ -f web/cycle.json ] && git add web/cycle.json
          [ -f web/cycle_prev.json ] && git add web/cycle_prev.json
          [ -f web/stocks.json ] && git add web/stocks.json
          [ -f web/bluechip/scan.json ] && git add web/bluechip/scan.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Nightly screener scan"
          git pull --rebase origin main
          git push
