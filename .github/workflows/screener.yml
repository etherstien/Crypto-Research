name: Nightly screener scan

on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily (~1:20am CT)
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      test_ntfy:
        description: "Send a test ntfy push instead of change-detection"
        required: false
        default: "0"

permissions:
  contents: write

# Queue runs instead of overlapping — two simultaneous runs race on the
# final data-commit push and the loser fails with a non-fast-forward error
concurrency:
  group: screener-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run screener
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          # keep yesterday's scan for rank-delta arrows on the site
          cp web/data.json web/data_prev.json 2>/dev/null || true
          python crypto-dashboard/screener.py --top 10
          cp crypto-dashboard/screener_cache.json web/data.json

      - name: Run BTC cycle monitor
        run: |
          cp web/cycle.json web/cycle_prev.json 2>/dev/null || true
          python crypto-dashboard/cycle_monitor.py || echo "cycle monitor failed - keeping previous cycle.json"
          [ -f crypto-dashboard/cycle_cache.json ] && cp crypto-dashboard/cycle_cache.json web/cycle.json || true

      - name: Fetch stock quotes for watchlist
        run: |
          python crypto-dashboard/watchlist_stocks.py || echo "stocks fetch failed (non-fatal)"
          [ -f crypto-dashboard/stocks_cache.json ] && cp crypto-dashboard/stocks_cache.json web/stocks.json || true

      - name: Send ntfy notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ github.event.inputs.test_ntfy || '0' }}
        run: python crypto-dashboard/notify.py || echo "notify failed (non-fatal)"

      - name: Commit refreshed data
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data.json
          [ -f web/data_prev.json ] && git add web/data_prev.json
          [ -f web/cycle.json ] && git add web/cycle.json
          [ -f web/cycle_prev.json ] && git add web/cycle_prev.json
          [ -f web/stocks.json ] && git add web/stocks.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Nightly screener scan"
          git pull --rebase origin main
          git push
